name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: file:./ci.db
      AUTH_SECRET: ci-only-secret-long-enough-for-hs256-signing-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Create database
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: UI contrast (WCAG AA)
        run: npm run check:contrast

      - name: Curriculum integrity
        run: npm run curriculum:verify -- --stats

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        run: npm run db:seed

      # `npx playwright test`, not `npm run test:e2e`: the build step above
      # already produced what `next start` serves, and the npm script would
      # build it a second time.
      - name: End-to-end tests
        run: npx playwright test
        env:
          CHROMIUM_PATH: ''

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
