# Builds the production image and runs it.
#
# The repository documents a container as a deployment target, but the
# environment this project is developed in has no Docker daemon, so for a long
# time the image was only ever reasoned about. Reasoning found a real bug in it
# once — the builder baking a SQLite client into an image whose own comment says
# the database URL arrives at runtime — which is precisely why reasoning is not
# enough on its own. A runner has a daemon, so the image gets built here.
#
# It runs against a throwaway Postgres in a service container. Nothing here
# touches the production database, and the only credentials involved are
# generated for this job and die with it.
name: Docker

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Local to the job and unreachable from anywhere else, so this password
        # is a fixture rather than a secret.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiml
          POSTGRES_PASSWORD: throwaway-ci-password
          POSTGRES_DB: aiml_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiml -d aiml_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Show the daemon this is building against
        run: |
          docker version
          docker info --format 'server: {{.ServerVersion}} | driver: {{.Driver}}'

      - name: Build the production image
        run: docker build -t aiml-mastery:ci .

      # The image is meant to carry no credentials. That is asserted here
      # rather than trusted, because the builder stage does set a placeholder
      # AUTH_SECRET so that Next can import a module which validates its
      # length, and a multi-stage boundary is the only thing stopping that
      # value reaching the image somebody actually runs.
      - name: Assert no credential survived into the image
        run: |
          set -euo pipefail
          env_json=$(docker image inspect aiml-mastery:ci --format '{{json .Config.Env}}')
          echo "image environment: $env_json"
          for name in AUTH_SECRET DATABASE_URL RESEND_API_KEY ANTHROPIC_API_KEY EMAIL_FROM; do
            if printf '%s' "$env_json" | grep -q "\"$name="; then
              echo "FAIL: $name is baked into the image environment"
              exit 1
            fi
          done
          echo "No credential-bearing variable is set in the image environment."

          # The placeholder must not have survived into the shipped files
          # either. Scanning /app rather than / on purpose: / walks /proc and
          # /sys, which do not terminate in any useful time, and everything
          # this image adds to its base lives under /app.
          hits=$(docker run --rm --entrypoint sh aiml-mastery:ci -c \
            'grep -rl "build-time-placeholder-not-a-secret" /app 2>/dev/null | head -5' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: the build-time placeholder is present in the shipped files:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "The build-time placeholder is not in the shipped files."

      # The builder stage runs `COPY . .`, so whatever .dockerignore fails to
      # exclude is present while the image is built. The runner stage copies
      # named paths out of it, which should mean none of that reaches the
      # image somebody runs — "should" being the word this step replaces.
      - name: Assert no secret-bearing file was copied into the image
        run: |
          set -euo pipefail
          found=$(docker run --rm --entrypoint sh aiml-mastery:ci -c '
            find /app \
              \( -name ".env" -o -name ".env.*" ! -name ".env.example" \
                 -o -name "*.pem" -o -name "*.key" -o -name "*.p12" -o -name "*.pfx" \
                 -o -name "id_rsa*" -o -name "id_ed25519*" -o -name ".npmrc" \
                 -o -name ".netrc" -o -name "*.db" -o -name ".vercel" -o -name ".git" \) \
              -print 2>/dev/null | head -20' || true)
          if [ -n "$found" ]; then
            echo "FAIL: the image carries files that should never ship in it:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "No .env file, private key, credential file, database file, .vercel or .git directory is present under /app."

          # A second pass by content rather than by name, because a secret in a
          # file nobody thought to name is the case the list above misses. The
          # tokens searched for are the recognisable prefixes of the providers
          # this project uses plus the PEM header, none of which has any reason
          # to appear in a built application.
          leaked=$(docker run --rm --entrypoint sh aiml-mastery:ci -c '
            grep -rlE "re_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|postgres(ql)?://[^/@ ]+:[^@ ]+@" \
              /app --exclude-dir=node_modules 2>/dev/null | head -10' || true)
          if [ -n "$leaked" ]; then
            echo "FAIL: credential-shaped content found in the image:"
            printf '%s\n' "$leaked"
            exit 1
          fi
          echo "No provider key, private key or credential-bearing database URL is present in the shipped application."

      - name: Assert the standalone server and its assets are present
        run: |
          docker run --rm --entrypoint sh aiml-mastery:ci -c \
            'set -e; ls -1 server.js >/dev/null; ls -d .next/static >/dev/null; ls -d public >/dev/null; ls -d node_modules/.prisma >/dev/null; echo present'

      # A client generated for the wrong database is the fault this image
      # already shipped once, so the provider it was built with is read back
      # out of the image rather than assumed from the build argument.
      - name: Assert the image was built for PostgreSQL
        run: |
          set -euo pipefail
          provider=$(docker run --rm --entrypoint sh aiml-mastery:ci -c \
            'sed -n "/datasource db/,/}/p" prisma/schema.prisma | sed -n "s/.*provider *= *\"\([a-z]*\)\".*/\1/p"')
          echo "datasource provider baked into the image: $provider"
          [ "$provider" = "postgresql" ] || { echo "FAIL: expected postgresql"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The schema has to exist before the container serves a request. This is
      # the throwaway database, never production.
      - name: Create the schema in the throwaway database
        env:
          DATABASE_URL: postgresql://aiml:throwaway-ci-password@localhost:5432/aiml_ci
          DATABASE_PROVIDER: postgresql
        run: |
          node scripts/db-provider.mjs postgresql
          npx prisma db push --skip-generate

      - name: Start the container
        run: |
          set -euo pipefail
          # Generated here and gone when the job ends. Host networking so the
          # container can reach the Postgres service on localhost.
          docker run -d --name aiml --network host \
            -e DATABASE_URL='postgresql://aiml:throwaway-ci-password@localhost:5432/aiml_ci' \
            -e AUTH_SECRET="$(openssl rand -hex 32)" \
            -e APP_URL='http://localhost:3000' \
            aiml-mastery:ci

          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/api/health 2>/dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "container never became reachable"; docker logs aiml; exit 1; fi
            sleep 2
          done

      - name: The running container reports a healthy database
        run: |
          set -euo pipefail
          body=$(curl -fsS http://localhost:3000/api/health)
          echo "health: $body"
          printf '%s' "$body" | grep -q '"ok":true' || { echo "FAIL: not ok"; docker logs aiml; exit 1; }
          printf '%s' "$body" | grep -q '"database":"ok"' || { echo "FAIL: database not ok"; docker logs aiml; exit 1; }

      # The point of running it at all: a real write through the real client
      # against a real Postgres, which is what the provider bug broke.
      - name: The running container writes to PostgreSQL and issues a session
        run: |
          set -euo pipefail
          email="docker-$(date +%s)-$RANDOM@example.com"
          out=$(curl -sS -i -X POST http://localhost:3000/api/auth/signup \
            -H 'Content-Type: application/json' -H 'Origin: http://localhost:3000' \
            -d "{\"name\":\"Docker Probe\",\"email\":\"$email\",\"password\":\"a-long-enough-docker-passphrase\"}")
          status=$(printf '%s' "$out" | head -1)
          echo "signup: $status"
          printf '%s' "$status" | grep -q ' 200' || { echo "FAIL: signup did not return 200"; docker logs aiml; exit 1; }
          printf '%s' "$out" | grep -qi 'set-cookie: *aiml_session=' || { echo "FAIL: no session cookie"; exit 1; }
          printf '%s' "$out" | grep -qi 'HttpOnly' || { echo "FAIL: session cookie not HttpOnly"; exit 1; }
          echo "Signup wrote to PostgreSQL and issued an HttpOnly session cookie."

      - name: A protected route still refuses an anonymous caller
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/state)
          echo "anonymous /api/state: $code"
          [ "$code" = "401" ] || { echo "FAIL: expected 401"; exit 1; }

      # Worth keeping: this log is what exposed the server binding a single
      # interface, which nothing static about the image revealed. The console
      # transport prints the verification link in full, though, so the token
      # is masked — it is dead the moment this job ends, but a token in a log
      # is a habit worth not forming.
      - name: Container log
        if: always()
        run: docker logs aiml 2>&1 | sed -E 's/(token=)[A-Za-z0-9_-]+/\1REDACTED/g' | tail -40 || true

      - name: Stop the container
        if: always()
        run: docker rm -f aiml || true
