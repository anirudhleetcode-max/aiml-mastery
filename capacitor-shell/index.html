<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AI/ML Mastery</title>
    <!--
      Capacitor requires a local web directory even when `server.url` points at
      a remote origin. This page is what occupies the WebView for the moment
      between the splash screen tearing down and the first frame arriving from
      https://aiml-mastery.vercel.app.

      It is deliberately inert: no script, no network, no fonts. Its only job
      is to be the same colour as the site so the handover is invisible. The
      real offline and error experience is native — see OfflineView.java —
      because a WebView that failed to load cannot be relied on to render its
      own error page.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0f19;
        color: #e6e8ee;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        opacity: 0.9;
      }
      @media (prefers-reduced-motion: no-preference) {
        .mark { animation: pulse 1.6s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.95; } }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="mark" viewBox="0 0 32 32" fill="none" aria-label="AI/ML Mastery">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c5cfb" />
            <stop offset="100%" stop-color="#2ad5ef" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="#0b0f19" />
        <rect x="1" y="1" width="30" height="30" rx="9" stroke="url(#g)" stroke-width="1.25" opacity="0.6" />
        <path d="M8.5 9.5 L16 16 L8.5 22.5 M16 16 L23.5 16" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="8.5" cy="9.5" r="2.1" fill="#7c5cfb" />
        <circle cx="8.5" cy="22.5" r="2.1" fill="#7c5cfb" />
        <circle cx="23.5" cy="16" r="2.4" fill="#2ad5ef" />
      </svg>
    </div>
  </body>
</html>
